<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="370" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">A branch is just a pointer</text>
  <text x="410" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">not a copy of my files — a 41-byte label on a commit</text>

  <!-- HEAD pill -->
  <rect x="565" y="90" width="70" height="24" rx="12" fill="#E8E2FB" stroke="#6B4FD8" stroke-width="2"/>
  <text x="600" y="107" text-anchor="middle" fill="#6B4FD8" font-family="monospace" font-size="12" font-weight="700">HEAD</text>
  <text x="648" y="106" fill="#9AA3AF" font-size="11">where I am now</text>
  <path d="M600 114 L600 126" stroke="#6B4FD8" stroke-width="2" marker-end="url(#arp)"/>

  <!-- main pill -->
  <rect x="565" y="128" width="70" height="24" rx="12" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="600" y="145" text-anchor="middle" fill="#196E67" font-family="monospace" font-size="12" font-weight="700">main</text>
  <path d="M600 152 L600 170" stroke="#19857C" stroke-width="2"/>

  <!-- feature pill -->
  <rect x="360" y="128" width="80" height="24" rx="12" fill="#F7E6D6" stroke="#DD7A38" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" fill="#9A5A2B" font-family="monospace" font-size="12" font-weight="700">feature</text>
  <path d="M400 152 L400 170" stroke="#DD7A38" stroke-width="2"/>

  <!-- commit line -->
  <line x1="200" y1="182" x2="620" y2="182" stroke="#C4CBD4" stroke-width="3"/>
  <circle cx="200" cy="182" r="12" fill="#9AA3AF"/>
  <circle cx="400" cy="182" r="12" fill="#DD7A38"/>
  <circle cx="600" cy="182" r="12" fill="#19857C"/>
  <text x="200" y="214" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="11">c1</text>
  <text x="400" y="214" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="11">c2</text>
  <text x="600" y="214" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="11">c3</text>

  <!-- ref file box -->
  <rect x="150" y="242" width="520" height="94" rx="12" fill="#F6F8FA" stroke="#E7EBF1" stroke-width="1.5"/>
  <text x="410" y="268" text-anchor="middle" fill="#16233B" font-size="13" font-weight="700">each branch = one line in .git: a name → a commit hash</text>
  <text x="182" y="296" fill="#196E67" font-family="monospace" font-size="12.5">refs/heads/main      →  26c8aa3…</text>
  <text x="182" y="320" fill="#9A5A2B" font-family="monospace" font-size="12.5">refs/heads/feature   →  a1b2c3d…</text>

  <defs>
    <marker id="arp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B4FD8"/></marker>
  </defs>
</svg>
