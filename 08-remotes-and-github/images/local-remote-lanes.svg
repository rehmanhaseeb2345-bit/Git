<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="898" height="336" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="450" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">Local · cache · server</text>
  <text x="450" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">origin/main is the cache in the middle — not the live server</text>

  <!-- push arc over the top -->
  <path d="M140 158 C 240 104, 660 104, 760 158" fill="none" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="450" y="106" text-anchor="middle" fill="#16233B" font-family="monospace" font-size="12" font-weight="700">git push</text>

  <!-- boxes -->
  <rect x="40" y="160" width="200" height="90" rx="12" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="140" y="196" text-anchor="middle" fill="#16233B" font-size="15" font-weight="700">my local main</text>
  <text x="140" y="216" text-anchor="middle" fill="#196E67" font-family="monospace" font-size="11">where I commit</text>

  <rect x="350" y="160" width="200" height="90" rx="12" fill="#F7E6D6" stroke="#DD7A38" stroke-width="2"/>
  <text x="450" y="196" text-anchor="middle" fill="#16233B" font-size="15" font-weight="700">origin/main</text>
  <text x="450" y="216" text-anchor="middle" fill="#9A5A2B" font-family="monospace" font-size="11">my cached view</text>

  <rect x="660" y="160" width="200" height="90" rx="12" fill="#E8E2FB" stroke="#6B4FD8" stroke-width="2"/>
  <text x="760" y="196" text-anchor="middle" fill="#16233B" font-size="15" font-weight="700">GitHub (origin)</text>
  <text x="760" y="216" text-anchor="middle" fill="#5B43B0" font-family="monospace" font-size="11">the real shared repo</text>

  <!-- fetch: server -> cache -->
  <text x="605" y="150" text-anchor="middle" fill="#6B4FD8" font-family="monospace" font-size="12" font-weight="700">git fetch</text>
  <path d="M650 205 L560 205" stroke="#6B4FD8" stroke-width="2.5" marker-end="url(#arp)"/>

  <!-- merge: cache -> local -->
  <text x="295" y="150" text-anchor="middle" fill="#DD7A38" font-family="monospace" font-size="12" font-weight="700">git merge</text>
  <path d="M340 205 L250 205" stroke="#DD7A38" stroke-width="2.5" marker-end="url(#at)"/>

  <!-- pull bracket -->
  <path d="M140 266 L140 274 L450 274 L450 266" fill="none" stroke="#9AA3AF" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="295" y="294" text-anchor="middle" fill="#5A6B85" font-size="12"><tspan font-family="monospace" font-weight="700" fill="#16233B">git pull</tspan> = fetch + merge, in one step</text>

  <text x="450" y="320" text-anchor="middle" fill="#9AA3AF" font-size="11.5">the cache only updates when I fetch or pull — never on its own</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5A6B85"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6B4FD8"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#DD7A38"/></marker>
  </defs>
</svg>
