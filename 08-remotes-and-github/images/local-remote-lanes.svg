<svg xmlns="http://www.w3.org/2000/svg" width="820" height="278" viewBox="0 0 820 278" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="276" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="38" font-size="21" font-weight="700" fill="#1f2328">Local, cache, and the server</text>
  <text x="40" y="61" font-size="14" fill="#57606a">Three places — and fetch, pull and push move commits between them.</text>

  <defs>
    <marker id="mP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8b5cf6"/></marker>
    <marker id="mO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#c2410c"/></marker>
    <marker id="mB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1971c2"/></marker>
  </defs>

  <!-- push arc over the top: local -> server -->
  <path d="M140 118 C 300 82, 520 82, 680 118" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#mB)"/>
  <text x="410" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1971c2" font-family="Consolas, Menlo, monospace">git push</text>

  <!-- boxes -->
  <rect x="40" y="120" width="200" height="86" rx="12" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.6"/>
  <text x="140" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1971c2">your local main</text>
  <text x="140" y="172" text-anchor="middle" font-size="12" fill="#57606a">where I commit</text>
  <text x="140" y="190" text-anchor="middle" font-size="11.5" fill="#6b8cae">on my machine</text>

  <rect x="310" y="120" width="200" height="86" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="410" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">origin/main</text>
  <text x="410" y="172" text-anchor="middle" font-size="12" fill="#57606a">my cached view of</text>
  <text x="410" y="190" text-anchor="middle" font-size="11.5" fill="#b07a52">the server</text>

  <rect x="580" y="120" width="200" height="86" rx="12" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="680" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">GitHub</text>
  <text x="680" y="172" text-anchor="middle" font-size="12" fill="#57606a">the real remote</text>
  <text x="680" y="190" text-anchor="middle" font-size="11.5" fill="#8b7fa6">everyone's copy</text>

  <!-- pull arrow: cache -> local -->
  <text x="276" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c" font-family="Consolas, Menlo, monospace">pull</text>
  <line x1="308" y1="156" x2="244" y2="156" stroke="#c2410c" stroke-width="2" marker-end="url(#mO)"/>

  <!-- fetch arrow: server -> cache -->
  <text x="546" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9" font-family="Consolas, Menlo, monospace">fetch</text>
  <line x1="578" y1="156" x2="514" y2="156" stroke="#8b5cf6" stroke-width="2" marker-end="url(#mP)"/>

  <!-- summary bar -->
  <rect x="40" y="226" width="740" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="251" font-size="12.5" fill="#1f2328"><tspan font-weight="700" fill="#6d28d9">fetch</tspan> updates origin/main only · <tspan font-weight="700" fill="#c2410c">pull</tspan> = fetch + merge into my files · <tspan font-weight="700" fill="#1971c2">push</tspan> sends my commits up.</text>
</svg>
