<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="898" height="338" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="450" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">Merge vs rebase</text>
  <text x="450" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">two ways to combine branches — one keeps the fork, one straightens it</text>

  <line x1="450" y1="92" x2="450" y2="286" stroke="#E7EBF1" stroke-width="2" stroke-dasharray="2 6"/>
  <text x="235" y="112" text-anchor="middle" fill="#19857C" font-family="monospace" font-size="13" font-weight="700">MERGE</text>
  <text x="665" y="112" text-anchor="middle" fill="#6B4FD8" font-family="monospace" font-size="13" font-weight="700">REBASE</text>

  <!-- ===== MERGE (left) ===== -->
  <!-- main line A-B-C -->
  <line x1="70" y1="160" x2="250" y2="160" stroke="#19857C" stroke-width="3"/>
  <!-- feature branch A->X->Y -->
  <line x1="70" y1="160" x2="160" y2="238" stroke="#DD7A38" stroke-width="3"/>
  <line x1="160" y1="238" x2="250" y2="238" stroke="#DD7A38" stroke-width="3"/>
  <!-- converge to M -->
  <line x1="250" y1="160" x2="340" y2="199" stroke="#19857C" stroke-width="3"/>
  <line x1="250" y1="238" x2="340" y2="199" stroke="#DD7A38" stroke-width="3"/>

  <circle cx="70" cy="160" r="15" fill="#9AA3AF"/><text x="70" y="165" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">A</text>
  <circle cx="160" cy="160" r="15" fill="#19857C"/><text x="160" y="165" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">B</text>
  <circle cx="250" cy="160" r="15" fill="#19857C"/><text x="250" y="165" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">C</text>
  <circle cx="160" cy="238" r="15" fill="#DD7A38"/><text x="160" y="243" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">X</text>
  <circle cx="250" cy="238" r="15" fill="#DD7A38"/><text x="250" y="243" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Y</text>
  <circle cx="340" cy="199" r="16" fill="#196E67"/><text x="340" y="204" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">M</text>

  <text x="250" y="142" text-anchor="middle" fill="#19857C" font-family="monospace" font-size="11" font-weight="700">main</text>
  <text x="250" y="262" text-anchor="middle" fill="#9A5A2B" font-family="monospace" font-size="11" font-weight="700">feature</text>
  <text x="372" y="203" fill="#196E67" font-size="11" font-weight="700">merge commit</text>

  <!-- ===== REBASE (right) ===== -->
  <line x1="500" y1="199" x2="860" y2="199" stroke="#9AA3AF" stroke-width="3"/>
  <circle cx="500" cy="199" r="15" fill="#9AA3AF"/><text x="500" y="204" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">A</text>
  <circle cx="590" cy="199" r="15" fill="#19857C"/><text x="590" y="204" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">B</text>
  <circle cx="680" cy="199" r="15" fill="#19857C"/><text x="680" y="204" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">C</text>
  <circle cx="770" cy="199" r="15" fill="#6B4FD8"/><text x="770" y="204" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">X'</text>
  <circle cx="860" cy="199" r="15" fill="#6B4FD8"/><text x="860" y="204" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Y'</text>
  <text x="635" y="166" text-anchor="middle" fill="#5A6B85" font-size="12">one clean straight line</text>
  <text x="815" y="230" text-anchor="middle" fill="#6B4FD8" font-family="monospace" font-size="11" font-weight="700">new hashes</text>

  <!-- bottom caption -->
  <text x="450" y="314" text-anchor="middle" fill="#5A6B85" font-size="12.5"><tspan fill="#19857C" font-weight="700">Merge</tspan> keeps the fork + a merge commit · <tspan fill="#6B4FD8" font-weight="700">rebase</tspan> makes a clean line but new hashes — unshared commits only</text>
</svg>
