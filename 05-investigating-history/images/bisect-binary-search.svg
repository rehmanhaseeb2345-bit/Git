<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 332" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="330" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">Finding a bug with bisect</text>
  <text x="410" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">binary search: each test halves the commits still in play</text>

  <!-- test callout -->
  <text x="410" y="104" text-anchor="middle" fill="#6B4FD8" font-size="12.5" font-weight="700">git bisect checks out the middle commit — I test it</text>
  <path d="M410 112 L410 136" stroke="#6B4FD8" stroke-width="2" marker-end="url(#arp)"/>

  <!-- baseline + dots -->
  <line x1="90" y1="158" x2="730" y2="158" stroke="#D7DCE3" stroke-width="3"/>
  <g>
    <circle cx="90" cy="158" r="10" fill="#19857C"/>
    <circle cx="170" cy="158" r="8" fill="#C4CBD4"/>
    <circle cx="250" cy="158" r="8" fill="#C4CBD4"/>
    <circle cx="330" cy="158" r="8" fill="#C4CBD4"/>
    <circle cx="410" cy="158" r="13" fill="#E8E2FB" stroke="#6B4FD8" stroke-width="3"/>
    <circle cx="490" cy="158" r="8" fill="#C4CBD4"/>
    <circle cx="570" cy="158" r="8" fill="#C4CBD4"/>
    <circle cx="650" cy="158" r="8" fill="#C4CBD4"/>
    <circle cx="730" cy="158" r="10" fill="#DD7A38"/>
  </g>
  <text x="90" y="186" text-anchor="middle" fill="#19857C" font-family="monospace" font-size="11" font-weight="700">good ✓</text>
  <text x="730" y="186" text-anchor="middle" fill="#C2410C" font-family="monospace" font-size="11" font-weight="700">bad ✗</text>
  <text x="410" y="140" text-anchor="middle" fill="#6B4FD8" font-family="monospace" font-size="10" font-weight="700">test</text>

  <!-- half brackets -->
  <path d="M92 214 L92 206 L406 206 L406 214" fill="none" stroke="#19857C" stroke-width="2"/>
  <text x="249" y="236" text-anchor="middle" fill="#19857C" font-size="12">if middle is <tspan font-weight="700">good</tspan> → bug isn't here</text>

  <path d="M414 214 L414 206 L728 206 L728 214" fill="none" stroke="#DD7A38" stroke-width="2"/>
  <text x="571" y="236" text-anchor="middle" fill="#9A5A2B" font-size="12">if middle is <tspan font-weight="700">bad</tspan> → bug is in here</text>

  <!-- bottom bar -->
  <rect x="150" y="268" width="520" height="34" rx="10" fill="#F6F8FA" stroke="#E7EBF1" stroke-width="1.5"/>
  <text x="410" y="290" text-anchor="middle" fill="#16233B" font-size="12.5">each answer halves what's left — ~100 commits found in about <tspan fill="#6B4FD8" font-weight="700">7 tests</tspan>, not 100</text>

  <defs>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6B4FD8"/></marker>
  </defs>
</svg>
