<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="298" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="40" font-size="21" font-weight="700" fill="#1f2328">Finding a bug with bisect</text>
  <text x="40" y="64" font-size="14" fill="#57606a">A bug is hiding in a range of commits. Each test halves what's left.</text>

  <!-- commit dots -->
  <g font-size="10" fill="#fff" text-anchor="middle" font-weight="700">
    <circle cx="110" cy="96" r="13" fill="#1a7f52"/><text x="110" y="100">c0</text>
    <circle cx="188" cy="96" r="13" fill="#ccd3da"/><text x="188" y="100" fill="#57606a">c1</text>
    <circle cx="266" cy="96" r="13" fill="#ccd3da"/><text x="266" y="100" fill="#57606a">c2</text>
    <circle cx="344" cy="96" r="13" fill="#ccd3da"/><text x="344" y="100" fill="#57606a">c3</text>
    <circle cx="422" cy="96" r="13" fill="#ccd3da"/><text x="422" y="100" fill="#57606a">c4</text>
    <circle cx="500" cy="96" r="14" fill="#d6541f" stroke="#7a2d0f" stroke-width="1.5"/><text x="500" y="100">c5</text>
    <circle cx="578" cy="96" r="13" fill="#ccd3da"/><text x="578" y="100" fill="#57606a">c6</text>
    <circle cx="656" cy="96" r="13" fill="#b23b2e"/><text x="656" y="100">c7</text>
  </g>
  <text x="110" y="128" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a7f52">known good</text>
  <text x="656" y="128" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b23b2e">known bad</text>

  <!-- halving rows -->
  <!-- row 1: full range, test c3 -> good -->
  <rect x="96" y="146" width="574" height="12" rx="6" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.2"/>
  <path d="M344 140 l5 6 l-10 0 z" fill="#1971c2"/>
  <text x="684" y="156" font-size="11" fill="#57606a">test <tspan font-weight="700" fill="#1971c2">c3</tspan> → good</text>

  <!-- row 2: c4..c7, test c5 -> bad -->
  <rect x="408" y="174" width="262" height="12" rx="6" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.2"/>
  <path d="M500 168 l5 6 l-10 0 z" fill="#1971c2"/>
  <text x="684" y="184" font-size="11" fill="#57606a">test <tspan font-weight="700" fill="#1971c2">c5</tspan> → bad</text>

  <!-- row 3: c4..c5, test c4 -> good -> culprit c5 -->
  <rect x="408" y="202" width="106" height="12" rx="6" fill="#fbe9df" stroke="#d6541f" stroke-width="1.2"/>
  <path d="M422 196 l5 6 l-10 0 z" fill="#d6541f"/>
  <text x="684" y="212" font-size="11" fill="#57606a">→ <tspan font-weight="700" fill="#d6541f">c5 is the culprit</tspan></text>

  <!-- summary bar -->
  <rect x="40" y="232" width="740" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="260" font-size="12.5" fill="#1f2328">Each test <tspan font-weight="700" fill="#1971c2">halves</tspan> the range — about <tspan font-weight="700" fill="#d6541f">7 tests</tspan> pin a bug in 1000s of commits (log₂). Finish with <tspan font-weight="700" font-family="Consolas, Menlo, monospace">git bisect reset</tspan>.</text>
</svg>
