<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="898" height="298" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="450" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">Recovery triage</text>
  <text x="450" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">every fix starts with: how far did the mistake get?</text>

  <!-- Card 1: uncommitted -->
  <rect x="20" y="92" width="200" height="174" rx="12" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">① still uncommitted</text>
  <line x1="40" y1="130" x2="200" y2="130" stroke="#B5DED6" stroke-width="1.5"/>
  <g fill="#196E67" font-family="monospace" font-size="12.5">
    <text x="42" y="156">git restore</text>
    <text x="42" y="180">git stash</text>
    <text x="42" y="204">git clean</text>
  </g>
  <text x="120" y="246" text-anchor="middle" fill="#19857C" font-size="11.5" font-weight="700">safe</text>

  <!-- Card 2: committed not pushed -->
  <rect x="240" y="92" width="200" height="174" rx="12" fill="#F7E6D6" stroke="#DD7A38" stroke-width="2"/>
  <text x="340" y="118" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">② committed, local</text>
  <line x1="260" y1="130" x2="420" y2="130" stroke="#EBC4A1" stroke-width="1.5"/>
  <g fill="#9A5A2B" font-family="monospace" font-size="12.5">
    <text x="262" y="156">git amend</text>
    <text x="262" y="180">git reset</text>
    <text x="262" y="204">git rebase -i</text>
  </g>
  <text x="340" y="246" text-anchor="middle" fill="#C2410C" font-size="11.5" font-weight="700">local only — rewrite freely</text>

  <!-- Card 3: pushed -->
  <rect x="460" y="92" width="200" height="174" rx="12" fill="#E8E2FB" stroke="#6B4FD8" stroke-width="2"/>
  <text x="560" y="118" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">③ already pushed</text>
  <line x1="480" y1="130" x2="640" y2="130" stroke="#C9BEF2" stroke-width="1.5"/>
  <g fill="#5B43B0" font-family="monospace" font-size="12.5">
    <text x="482" y="156">git revert</text>
    <text x="482" y="180" fill="#9AA3AF">— never reset</text>
    <text x="482" y="204" fill="#9AA3AF">— never rebase</text>
  </g>
  <text x="560" y="246" text-anchor="middle" fill="#6B4FD8" font-size="11.5" font-weight="700">shared — handle with care</text>

  <!-- Card 4: lost -->
  <rect x="680" y="92" width="200" height="174" rx="12" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <text x="780" y="118" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">④ looks lost</text>
  <line x1="700" y1="130" x2="860" y2="130" stroke="#E7EBF1" stroke-width="1.5"/>
  <g fill="#16233B" font-family="monospace" font-size="12.5">
    <text x="702" y="156">git reflog</text>
    <text x="702" y="180" fill="#5A6B85">find the hash</text>
    <text x="702" y="204" fill="#5A6B85">reset back to it</text>
  </g>
  <text x="780" y="246" text-anchor="middle" fill="#5A6B85" font-size="11.5" font-weight="700">almost always recoverable</text>
</svg>
