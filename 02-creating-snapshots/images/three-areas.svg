<svg xmlns="http://www.w3.org/2000/svg" width="820" height="296" viewBox="0 0 820 296" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="294" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="40" font-size="21" font-weight="700" fill="#1f2328">The three areas</text>
  <text x="40" y="64" font-size="14" fill="#57606a">Every change moves through three places — and two commands move it along.</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/>
    </marker>
  </defs>

  <!-- working directory -->
  <rect x="46" y="92" width="206" height="104" rx="12" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.6"/>
  <text x="149" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1971c2">Working Directory</text>
  <text x="149" y="150" text-anchor="middle" font-size="12" fill="#57606a">my files — where I edit</text>
  <text x="149" y="169" text-anchor="middle" font-size="11.5" fill="#6b8cae">everything I'm working on</text>

  <!-- staging area -->
  <rect x="307" y="92" width="206" height="104" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="410" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">Staging Area</text>
  <text x="410" y="150" text-anchor="middle" font-size="12" fill="#57606a">what's going in</text>
  <text x="410" y="169" text-anchor="middle" font-size="11.5" fill="#b07a52">my next commit</text>

  <!-- repository -->
  <rect x="568" y="92" width="206" height="104" rx="12" fill="#edfbf3" stroke="#1a7f52" stroke-width="1.6"/>
  <text x="671" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f52">Repository</text>
  <text x="671" y="150" text-anchor="middle" font-size="12" fill="#57606a">the .git folder</text>
  <text x="671" y="169" text-anchor="middle" font-size="11.5" fill="#5a9c7e">permanent history</text>

  <!-- arrows + command labels -->
  <text x="279" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#1971c2" font-family="Consolas, Menlo, monospace">git add</text>
  <line x1="254" y1="144" x2="303" y2="144" stroke="#1971c2" stroke-width="2" marker-end="url(#ar)"/>

  <text x="540" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#1971c2" font-family="Consolas, Menlo, monospace">git commit</text>
  <line x1="515" y1="144" x2="564" y2="144" stroke="#1971c2" stroke-width="2" marker-end="url(#ar)"/>

  <!-- summary bar -->
  <rect x="40" y="226" width="740" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="254" font-size="12.5" fill="#1f2328">Edit in the <tspan font-weight="700" fill="#1971c2">working directory</tspan> · stage just what I want in the <tspan font-weight="700" fill="#c2410c">staging area</tspan> · then <tspan font-weight="700" fill="#1a7f52">commit</tspan> it into history.</text>
</svg>
