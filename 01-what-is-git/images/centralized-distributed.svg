<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="408" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">Centralized vs distributed</text>
  <text x="410" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">who holds the full history of the project</text>

  <!-- divider -->
  <line x1="410" y1="92" x2="410" y2="372" stroke="#E7EBF1" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- ============ LEFT: centralized ============ -->
  <text x="205" y="108" text-anchor="middle" fill="#DD7A38" font-family="monospace" font-size="13" font-weight="700">CENTRALIZED</text>

  <rect x="128" y="124" width="154" height="56" rx="12" fill="#F7E6D6" stroke="#DD7A38" stroke-width="2"/>
  <text x="205" y="148" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">SERVER</text>
  <text x="205" y="167" text-anchor="middle" fill="#9A5A2B" font-family="monospace" font-size="11">the only full history</text>

  <!-- arrows down to devs -->
  <path d="M160 180 L120 246" stroke="#DD7A38" stroke-width="2" marker-end="url(#at)"/>
  <path d="M205 182 L205 244" stroke="#DD7A38" stroke-width="2" marker-end="url(#at)"/>
  <path d="M250 180 L290 246" stroke="#DD7A38" stroke-width="2" marker-end="url(#at)"/>

  <rect x="78" y="248" width="84" height="46" rx="10" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <text x="120" y="268" text-anchor="middle" fill="#16233B" font-size="12" font-weight="700">dev A</text>
  <text x="120" y="284" text-anchor="middle" fill="#9AA3AF" font-family="monospace" font-size="10">no history</text>
  <rect x="163" y="248" width="84" height="46" rx="10" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <text x="205" y="268" text-anchor="middle" fill="#16233B" font-size="12" font-weight="700">dev B</text>
  <text x="205" y="284" text-anchor="middle" fill="#9AA3AF" font-family="monospace" font-size="10">no history</text>
  <rect x="248" y="248" width="84" height="46" rx="10" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <text x="290" y="268" text-anchor="middle" fill="#16233B" font-size="12" font-weight="700">dev C</text>
  <text x="290" y="284" text-anchor="middle" fill="#9AA3AF" font-family="monospace" font-size="10">no history</text>

  <text x="205" y="326" text-anchor="middle" fill="#5A6B85" font-size="12">Every action needs the network.</text>
  <text x="205" y="344" text-anchor="middle" fill="#5A6B85" font-size="12">Server down → nobody can commit.</text>

  <!-- ============ RIGHT: distributed ============ -->
  <text x="615" y="108" text-anchor="middle" fill="#19857C" font-family="monospace" font-size="13" font-weight="700">DISTRIBUTED</text>

  <rect x="538" y="124" width="154" height="56" rx="12" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="615" y="148" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">REMOTE (GitHub)</text>
  <text x="615" y="167" text-anchor="middle" fill="#196E67" font-family="monospace" font-size="11">just one more copy</text>

  <!-- dashed sync links down to devs -->
  <path d="M570 180 L528 246" stroke="#19857C" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M615 182 L615 244" stroke="#19857C" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M660 180 L700 246" stroke="#19857C" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="484" y="248" width="90" height="46" rx="10" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="529" y="268" text-anchor="middle" fill="#16233B" font-size="12" font-weight="700">dev A</text>
  <text x="529" y="284" text-anchor="middle" fill="#196E67" font-family="monospace" font-size="10">+ full history</text>
  <rect x="580" y="248" width="90" height="46" rx="10" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="625" y="268" text-anchor="middle" fill="#16233B" font-size="12" font-weight="700">dev B</text>
  <text x="625" y="284" text-anchor="middle" fill="#196E67" font-family="monospace" font-size="10">+ full history</text>
  <rect x="676" y="248" width="90" height="46" rx="10" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="721" y="268" text-anchor="middle" fill="#16233B" font-size="12" font-weight="700">dev C</text>
  <text x="721" y="284" text-anchor="middle" fill="#196E67" font-family="monospace" font-size="10">+ full history</text>

  <text x="615" y="326" text-anchor="middle" fill="#5A6B85" font-size="12">Everyone has the whole history.</text>
  <text x="615" y="344" text-anchor="middle" fill="#5A6B85" font-size="12">Works offline · no single point of failure.</text>

  <!-- bottom takeaway -->
  <text x="410" y="392" text-anchor="middle" fill="#5A6B85" font-size="12.5"><tspan fill="#DD7A38" font-weight="700">Centralized</tspan> = one server holds everything · <tspan fill="#19857C" font-weight="700">distributed</tspan> = every machine does — and that's <tspan fill="#16233B" font-weight="700">Git</tspan>.</text>

  <defs>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#DD7A38"/></marker>
  </defs>
</svg>
