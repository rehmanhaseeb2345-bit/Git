<svg xmlns="http://www.w3.org/2000/svg" width="820" height="384" viewBox="0 0 820 384" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="382" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">Centralized vs distributed</text>
  <text x="40" y="66" font-size="14" fill="#57606a">Who holds the project's history — one server, or every machine.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="410" y1="92" x2="410" y2="318" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ CENTRALIZED (left) ============ -->
  <text x="210" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9" letter-spacing="0.5">CENTRALIZED</text>

  <!-- server -->
  <rect x="150" y="112" width="120" height="48" rx="10" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="210" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">SERVER</text>
  <text x="210" y="151" text-anchor="middle" font-size="11" fill="#8b7fa6">the only history</text>

  <!-- links server -> devs -->
  <line x1="210" y1="160" x2="102" y2="216" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="210" y1="160" x2="210" y2="216" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="210" y1="160" x2="318" y2="216" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- devs -->
  <rect x="58" y="218" width="88" height="40" rx="9" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.3"/>
  <text x="102" y="243" text-anchor="middle" font-size="12" fill="#1971c2">dev A</text>
  <rect x="166" y="218" width="88" height="40" rx="9" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.3"/>
  <text x="210" y="243" text-anchor="middle" font-size="12" fill="#1971c2">dev B</text>
  <rect x="274" y="218" width="88" height="40" rx="9" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.3"/>
  <text x="318" y="243" text-anchor="middle" font-size="12" fill="#1971c2">dev C</text>

  <text x="210" y="288" text-anchor="middle" font-size="12" fill="#57606a">History only on the server.</text>
  <text x="210" y="305" text-anchor="middle" font-size="12" fill="#57606a">Server down = everyone stuck.</text>

  <!-- ============ DISTRIBUTED (right) ============ -->
  <text x="612" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f52" letter-spacing="0.5">DISTRIBUTED</text>

  <!-- server (just another full copy) -->
  <rect x="552" y="112" width="120" height="48" rx="10" fill="#edfbf3" stroke="#1a7f52" stroke-width="1.4"/>
  <text x="612" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f52">SERVER</text>
  <text x="612" y="151" text-anchor="middle" font-size="11" fill="#5a9c7e">a full copy too</text>

  <!-- links (two-way, everyone independent) -->
  <line x1="612" y1="160" x2="504" y2="216" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="612" y1="160" x2="612" y2="216" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="612" y1="160" x2="720" y2="216" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- devs, each with full history -->
  <rect x="460" y="218" width="88" height="46" rx="9" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.3"/>
  <text x="504" y="239" text-anchor="middle" font-size="12" fill="#1971c2">dev A</text>
  <text x="504" y="255" text-anchor="middle" font-size="10" fill="#1a7f52">+ full history</text>
  <rect x="568" y="218" width="88" height="46" rx="9" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.3"/>
  <text x="612" y="239" text-anchor="middle" font-size="12" fill="#1971c2">dev B</text>
  <text x="612" y="255" text-anchor="middle" font-size="10" fill="#1a7f52">+ full history</text>
  <rect x="676" y="218" width="88" height="46" rx="9" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.3"/>
  <text x="720" y="239" text-anchor="middle" font-size="12" fill="#1971c2">dev C</text>
  <text x="720" y="255" text-anchor="middle" font-size="10" fill="#1a7f52">+ full history</text>

  <text x="612" y="290" text-anchor="middle" font-size="12" fill="#57606a">Every machine has the whole history.</text>
  <text x="612" y="307" text-anchor="middle" font-size="12" fill="#57606a">Works offline · no single point of failure.</text>

  <!-- ============ summary bar ============ -->
  <rect x="40" y="330" width="740" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="355" font-size="12.5" fill="#1f2328"><tspan font-weight="700" fill="#6d28d9">Centralized</tspan> = one server holds everything · <tspan font-weight="700" fill="#1a7f52">Distributed</tspan> = every machine holds everything — and that's <tspan font-weight="700" fill="#1971c2">Git</tspan>.</text>
</svg>
