<svg xmlns="http://www.w3.org/2000/svg" width="820" height="356" viewBox="0 0 820 356" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="354" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="40" font-size="21" font-weight="700" fill="#1f2328">Git saves snapshots over time</text>
  <text x="40" y="64" font-size="14" fill="#57606a">Each commit is a full picture of my project — and I can jump back to any one.</text>

  <defs>
    <marker id="back" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- snapshot cards: the project at c1..c4, one file changing each step -->
  <!-- c1 -->
  <rect x="66" y="86" width="148" height="104" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="86" y="104" width="108" height="14" rx="3" fill="#ccd3da"/>
  <rect x="86" y="126" width="108" height="14" rx="3" fill="#ccd3da"/>
  <rect x="86" y="148" width="108" height="14" rx="3" fill="#ccd3da"/>
  <!-- c2: one file changed -->
  <rect x="246" y="86" width="148" height="104" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="266" y="104" width="108" height="14" rx="3" fill="#9ec5ef"/>
  <rect x="266" y="126" width="108" height="14" rx="3" fill="#ccd3da"/>
  <rect x="266" y="148" width="108" height="14" rx="3" fill="#ccd3da"/>
  <!-- c3: another changed -->
  <rect x="426" y="86" width="148" height="104" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="446" y="104" width="108" height="14" rx="3" fill="#9ec5ef"/>
  <rect x="446" y="126" width="108" height="14" rx="3" fill="#f0b589"/>
  <rect x="446" y="148" width="108" height="14" rx="3" fill="#ccd3da"/>
  <!-- c4: a new file added -->
  <rect x="606" y="86" width="148" height="104" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="626" y="104" width="108" height="14" rx="3" fill="#9ec5ef"/>
  <rect x="626" y="126" width="108" height="14" rx="3" fill="#f0b589"/>
  <rect x="626" y="148" width="108" height="14" rx="3" fill="#a7d8b8"/>

  <!-- connectors card -> commit dot -->
  <line x1="140" y1="190" x2="140" y2="211" stroke="#c4cdd6" stroke-width="1.5"/>
  <line x1="320" y1="190" x2="320" y2="211" stroke="#c4cdd6" stroke-width="1.5"/>
  <line x1="500" y1="190" x2="500" y2="211" stroke="#c4cdd6" stroke-width="1.5"/>
  <line x1="680" y1="190" x2="680" y2="211" stroke="#c4cdd6" stroke-width="1.5"/>

  <!-- timeline -->
  <line x1="56" y1="221" x2="764" y2="221" stroke="#d0d7de" stroke-width="2"/>
  <text x="784" y="225" text-anchor="end" font-size="11" fill="#8a93a0" font-style="italic">time →</text>

  <!-- commit dots -->
  <circle cx="140" cy="221" r="11" fill="#1971c2"/><text x="140" y="225" text-anchor="middle" font-size="10" fill="#fff">c1</text>
  <circle cx="320" cy="221" r="11" fill="#1971c2"/><text x="320" y="225" text-anchor="middle" font-size="10" fill="#fff">c2</text>
  <circle cx="500" cy="221" r="11" fill="#1971c2"/><text x="500" y="225" text-anchor="middle" font-size="10" fill="#fff">c3</text>
  <circle cx="680" cy="221" r="12" fill="#1a7f52"/><text x="680" y="225" text-anchor="middle" font-size="9" fill="#fff">now</text>

  <!-- jump-back arc -->
  <path d="M668 232 C 520 286, 300 286, 152 232" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#back)"/>
  <text x="410" y="283" text-anchor="middle" font-size="12" fill="#6d28d9" font-weight="600">git lets me jump back to any snapshot</text>

  <!-- summary bar -->
  <rect x="40" y="300" width="740" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="325" font-size="12.5" fill="#1f2328">A <tspan font-weight="700" fill="#1971c2">commit</tspan> = a full snapshot of my files · the history is just the row of them · and it all lives <tspan font-weight="700" fill="#1a7f52">on my machine</tspan>.</text>
</svg>
