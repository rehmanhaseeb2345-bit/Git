<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 414" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="412" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">How Git saves my project</text>
  <text x="410" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">each commit is a full snapshot — not a list of changes</text>

  <!-- commit C1 -->
  <rect x="120" y="98" width="150" height="150" rx="12" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <rect x="140" y="118" width="110" height="30" rx="6" fill="#D9EEEB" stroke="#19857C" stroke-width="1.6"/>
  <text x="152" y="138" fill="#16233B" font-family="monospace" font-size="11" font-weight="600">index.html</text>
  <rect x="140" y="156" width="110" height="30" rx="6" fill="#D9EEEB" stroke="#19857C" stroke-width="1.6"/>
  <text x="152" y="176" fill="#16233B" font-family="monospace" font-size="11" font-weight="600">style.css</text>
  <rect x="140" y="194" width="110" height="30" rx="6" fill="#D9EEEB" stroke="#19857C" stroke-width="1.6"/>
  <text x="152" y="214" fill="#16233B" font-family="monospace" font-size="11" font-weight="600">app.js</text>
  <text x="195" y="270" text-anchor="middle" fill="#19857C" font-family="monospace" font-size="12" font-weight="700">a1b2c3d</text>
  <text x="195" y="288" text-anchor="middle" fill="#5A6B85" font-size="12">first commit</text>

  <!-- arrow C1 -> C2 -->
  <path d="M272 173 L333 173" stroke="#5A6B85" stroke-width="2" marker-end="url(#ar)"/>

  <!-- commit C2 -->
  <rect x="335" y="98" width="150" height="150" rx="12" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <rect x="355" y="118" width="110" height="30" rx="6" fill="#F3F4F6" stroke="#D7DCE3" stroke-width="1.6"/>
  <text x="367" y="138" fill="#9AA3AF" font-family="monospace" font-size="11">index.html</text>
  <rect x="355" y="156" width="110" height="30" rx="6" fill="#D9EEEB" stroke="#19857C" stroke-width="1.6"/>
  <text x="367" y="176" fill="#16233B" font-family="monospace" font-size="11" font-weight="600">style.css</text>
  <rect x="355" y="194" width="110" height="30" rx="6" fill="#F3F4F6" stroke="#D7DCE3" stroke-width="1.6"/>
  <text x="367" y="214" fill="#9AA3AF" font-family="monospace" font-size="11">app.js</text>
  <text x="410" y="270" text-anchor="middle" fill="#19857C" font-family="monospace" font-size="12" font-weight="700">9c2f1ab</text>
  <text x="410" y="288" text-anchor="middle" fill="#5A6B85" font-size="12">restyle the header</text>

  <!-- arrow C2 -> C3 -->
  <path d="M487 173 L548 173" stroke="#5A6B85" stroke-width="2" marker-end="url(#ar)"/>

  <!-- commit C3 -->
  <rect x="550" y="98" width="150" height="150" rx="12" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <rect x="570" y="118" width="110" height="30" rx="6" fill="#F3F4F6" stroke="#D7DCE3" stroke-width="1.6"/>
  <text x="582" y="138" fill="#9AA3AF" font-family="monospace" font-size="11">index.html</text>
  <rect x="570" y="156" width="110" height="30" rx="6" fill="#F3F4F6" stroke="#D7DCE3" stroke-width="1.6"/>
  <text x="582" y="176" fill="#9AA3AF" font-family="monospace" font-size="11">style.css</text>
  <rect x="570" y="194" width="110" height="30" rx="6" fill="#D9EEEB" stroke="#19857C" stroke-width="1.6"/>
  <text x="582" y="214" fill="#16233B" font-family="monospace" font-size="11" font-weight="600">app.js</text>
  <text x="625" y="270" text-anchor="middle" fill="#19857C" font-family="monospace" font-size="12" font-weight="700">b3a05f2</text>
  <text x="625" y="288" text-anchor="middle" fill="#5A6B85" font-size="12">add search</text>

  <!-- HEAD tag on latest -->
  <rect x="588" y="74" width="74" height="20" rx="10" fill="#E8E2FB" stroke="#6B4FD8" stroke-width="1.5"/>
  <text x="625" y="88" text-anchor="middle" fill="#6B4FD8" font-family="monospace" font-size="11" font-weight="700">HEAD</text>

  <!-- jump-back arc -->
  <path d="M612 302 C 470 342, 350 342, 210 306" fill="none" stroke="#6B4FD8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arp)"/>
  <text x="410" y="372" text-anchor="middle" fill="#6B4FD8" font-size="12.5" font-weight="600">git checkout a1b2c3d → jump back to any snapshot</text>

  <!-- legend -->
  <text x="410" y="398" text-anchor="middle" fill="#5A6B85" font-size="12"><tspan fill="#19857C" font-weight="700">teal</tspan> = files I changed · <tspan fill="#9AA3AF" font-weight="700">grey</tspan> = carried over — but every commit still stores the whole project</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5A6B85"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6B4FD8"/></marker>
  </defs>
</svg>
