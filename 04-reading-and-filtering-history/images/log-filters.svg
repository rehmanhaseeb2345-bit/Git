<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="358" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="410" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">Filtering the log</text>
  <text x="410" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">thousands of commits in → the flags I need → just the ones I want</text>

  <!-- Left: whole history -->
  <rect x="40" y="104" width="196" height="206" rx="12" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <text x="138" y="128" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">the whole history</text>
  <text x="138" y="146" text-anchor="middle" fill="#9AA3AF" font-family="monospace" font-size="10">thousands of commits</text>
  <g stroke="#D7DCE3" stroke-width="3">
    <line x1="80" y1="172" x2="212" y2="172"/><line x1="80" y1="196" x2="200" y2="196"/>
    <line x1="80" y1="220" x2="212" y2="220"/><line x1="80" y1="244" x2="196" y2="244"/>
    <line x1="80" y1="268" x2="212" y2="268"/><line x1="80" y1="292" x2="204" y2="292"/>
  </g>
  <g fill="#9AA3AF">
    <circle cx="66" cy="172" r="5"/><circle cx="66" cy="196" r="5"/><circle cx="66" cy="220" r="5"/>
    <circle cx="66" cy="244" r="5"/><circle cx="66" cy="268" r="5"/><circle cx="66" cy="292" r="5"/>
  </g>

  <!-- Middle: filters -->
  <rect x="312" y="124" width="196" height="166" rx="12" fill="#F7E6D6" stroke="#DD7A38" stroke-width="2"/>
  <text x="410" y="150" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">filters — they stack</text>
  <g fill="#9A5A2B" font-family="monospace" font-size="12">
    <text x="334" y="178">--author=Mosh</text>
    <text x="334" y="200">--grep="bug"</text>
    <text x="334" y="222">-S"logout"</text>
    <text x="334" y="244">--after="1 week"</text>
    <text x="334" y="266">-- auth.js</text>
  </g>

  <!-- Right: result -->
  <rect x="584" y="150" width="196" height="120" rx="12" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="682" y="176" text-anchor="middle" fill="#16233B" font-size="14" font-weight="700">just what I wanted</text>
  <g stroke="#7FC3B6" stroke-width="3">
    <line x1="624" y1="210" x2="756" y2="210"/><line x1="624" y1="240" x2="740" y2="240"/>
  </g>
  <g fill="#19857C">
    <circle cx="610" cy="210" r="5"/><circle cx="610" cy="240" r="5"/>
  </g>

  <!-- arrows -->
  <path d="M242 207 L306 207" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M514 207 L578 207" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#ar)"/>

  <text x="410" y="336" text-anchor="middle" fill="#5A6B85" font-size="13"><tspan fill="#DD7A38" font-weight="700">--grep</tspan> searches the message · <tspan fill="#DD7A38" font-weight="700">-S</tspan> searches the code — the two I always mix up</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5A6B85"/></marker>
  </defs>
</svg>
