<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 342" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="898" height="340" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="450" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">The fork workflow</text>
  <text x="450" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">how I contribute to a repo I can't push to</text>

  <!-- push arc over the top: local -> origin -->
  <path d="M760 150 C 700 108, 510 108, 450 150" fill="none" stroke="#19857C" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="605" y="100" text-anchor="middle" fill="#19857C" font-family="monospace" font-size="12" font-weight="700">③ branch · commit · push</text>

  <!-- boxes -->
  <rect x="40" y="150" width="200" height="86" rx="12" fill="#E8E2FB" stroke="#6B4FD8" stroke-width="2"/>
  <text x="140" y="188" text-anchor="middle" fill="#16233B" font-size="15" font-weight="700">upstream</text>
  <text x="140" y="208" text-anchor="middle" fill="#5B43B0" font-family="monospace" font-size="11">the original project</text>

  <rect x="350" y="150" width="200" height="86" rx="12" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="450" y="188" text-anchor="middle" fill="#16233B" font-size="15" font-weight="700">my fork</text>
  <text x="450" y="208" text-anchor="middle" fill="#196E67" font-family="monospace" font-size="11">origin · I can push</text>

  <rect x="660" y="150" width="200" height="86" rx="12" fill="#FBFCFD" stroke="#DDE3EC" stroke-width="2"/>
  <text x="760" y="188" text-anchor="middle" fill="#16233B" font-size="15" font-weight="700">my machine</text>
  <text x="760" y="208" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="11">a clone of my fork</text>

  <!-- forward arrows -->
  <path d="M248 193 L344 193" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="296" y="177" text-anchor="middle" fill="#16233B" font-family="monospace" font-size="12" font-weight="700">① fork</text>
  <path d="M558 193 L654 193" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="606" y="177" text-anchor="middle" fill="#16233B" font-family="monospace" font-size="12" font-weight="700">② clone</text>

  <!-- PR arc under the bottom: origin -> upstream -->
  <path d="M450 236 C 390 292, 200 292, 140 236" fill="none" stroke="#6B4FD8" stroke-width="2.5" marker-end="url(#arp)"/>
  <text x="295" y="312" text-anchor="middle" fill="#6B4FD8" font-size="12.5" font-weight="700">④ open a Pull Request — they review &amp; merge</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5A6B85"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#19857C"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6B4FD8"/></marker>
  </defs>
</svg>
