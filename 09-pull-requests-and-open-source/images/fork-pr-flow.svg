<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="298" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="38" font-size="21" font-weight="700" fill="#1f2328">Contributing with a fork</text>
  <text x="40" y="60" font-size="13.5" fill="#57606a">I can't push to a project I don't own — so I fork it, work on my copy, and propose changes back.</text>

  <defs>
    <marker id="gP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8b5cf6"/></marker>
    <marker id="gG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1a7f52"/></marker>
    <marker id="gB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1971c2"/></marker>
  </defs>

  <!-- PR arc over the top: fork -> upstream -->
  <path d="M410 112 C 300 82, 200 82, 135 112" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#gP)"/>
  <text x="272" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">④ open a pull request</text>

  <!-- boxes -->
  <rect x="40" y="112" width="190" height="58" rx="11" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="135" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">UPSTREAM</text>
  <text x="135" y="157" text-anchor="middle" font-size="11.5" fill="#57606a">the original · "upstream"</text>

  <rect x="315" y="112" width="190" height="58" rx="11" fill="#edfbf3" stroke="#1a7f52" stroke-width="1.6"/>
  <text x="410" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a7f52">YOUR FORK</text>
  <text x="410" y="157" text-anchor="middle" font-size="11.5" fill="#57606a">my copy · "origin"</text>

  <rect x="590" y="112" width="190" height="58" rx="11" fill="#e7f0fb" stroke="#1971c2" stroke-width="1.6"/>
  <text x="685" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1971c2">LOCAL CLONE</text>
  <text x="685" y="157" text-anchor="middle" font-size="11.5" fill="#57606a">on my machine</text>

  <!-- 1 fork: upstream -> fork -->
  <text x="272" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a7f52">① fork</text>
  <line x1="232" y1="141" x2="313" y2="141" stroke="#1a7f52" stroke-width="2" marker-end="url(#gG)"/>
  <!-- 2 clone: fork -> clone -->
  <text x="547" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1971c2">② clone</text>
  <line x1="507" y1="141" x2="588" y2="141" stroke="#1971c2" stroke-width="2" marker-end="url(#gB)"/>

  <!-- 3 push arc: clone -> fork (below) -->
  <path d="M685 170 C 685 212, 410 212, 410 172" fill="none" stroke="#1a7f52" stroke-width="2" marker-end="url(#gG)"/>
  <text x="547" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a7f52">③ branch, commit &amp; push to my fork</text>

  <!-- summary bar -->
  <rect x="40" y="246" width="740" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="271" font-size="12.5" fill="#1f2328"><tspan font-weight="700" fill="#1a7f52">origin</tspan> = my fork (I push here) · <tspan font-weight="700" fill="#6d28d9">upstream</tspan> = the original (I <tspan font-family="Consolas, Menlo, monospace">fetch</tspan> from it to stay current).</text>
</svg>
