<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 318" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <rect x="1" y="1" width="898" height="316" rx="18" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <text x="450" y="44" text-anchor="middle" fill="#16233B" font-size="22" font-weight="700">How far each reset reaches</text>
  <text x="450" y="66" text-anchor="middle" fill="#5A6B85" font-family="monospace" font-size="13">the flag decides how much it drags back with HEAD</text>

  <!-- column headers -->
  <text x="383" y="104" text-anchor="middle" fill="#5A6B85" font-size="12" font-weight="700">moves HEAD back</text>
  <text x="577" y="104" text-anchor="middle" fill="#5A6B85" font-size="12" font-weight="700">unstages changes</text>
  <text x="771" y="104" text-anchor="middle" fill="#C2410C" font-size="12" font-weight="700">discards your edits ⚠</text>

  <!-- Row 1: soft -->
  <text x="46" y="142" fill="#16233B" font-family="monospace" font-size="14" font-weight="700">--soft</text>
  <text x="46" y="160" fill="#5A6B85" font-size="11">keep changes staged</text>
  <rect x="292" y="122" width="182" height="46" rx="10" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="383" y="151" text-anchor="middle" fill="#19857C" font-size="17" font-weight="700">✓</text>
  <rect x="486" y="122" width="182" height="46" rx="10" fill="#FBFCFD" stroke="#E7EBF1" stroke-width="2"/>
  <text x="577" y="150" text-anchor="middle" fill="#C4CBD4" font-size="16">—</text>
  <rect x="680" y="122" width="182" height="46" rx="10" fill="#FBFCFD" stroke="#E7EBF1" stroke-width="2"/>
  <text x="771" y="150" text-anchor="middle" fill="#C4CBD4" font-size="16">—</text>

  <!-- Row 2: mixed -->
  <text x="46" y="196" fill="#16233B" font-family="monospace" font-size="14" font-weight="700">--mixed</text>
  <text x="46" y="214" fill="#5A6B85" font-size="11">unstage, keep edits (default)</text>
  <rect x="292" y="176" width="182" height="46" rx="10" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="383" y="205" text-anchor="middle" fill="#19857C" font-size="17" font-weight="700">✓</text>
  <rect x="486" y="176" width="182" height="46" rx="10" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="577" y="205" text-anchor="middle" fill="#19857C" font-size="17" font-weight="700">✓</text>
  <rect x="680" y="176" width="182" height="46" rx="10" fill="#FBFCFD" stroke="#E7EBF1" stroke-width="2"/>
  <text x="771" y="204" text-anchor="middle" fill="#C4CBD4" font-size="16">—</text>

  <!-- Row 3: hard -->
  <text x="46" y="250" fill="#16233B" font-family="monospace" font-size="14" font-weight="700">--hard</text>
  <text x="46" y="268" fill="#C2410C" font-size="11">discard edits — destructive</text>
  <rect x="292" y="230" width="182" height="46" rx="10" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="383" y="259" text-anchor="middle" fill="#19857C" font-size="17" font-weight="700">✓</text>
  <rect x="486" y="230" width="182" height="46" rx="10" fill="#D9EEEB" stroke="#19857C" stroke-width="2"/>
  <text x="577" y="259" text-anchor="middle" fill="#19857C" font-size="17" font-weight="700">✓</text>
  <rect x="680" y="230" width="182" height="46" rx="10" fill="#F7E6D6" stroke="#DD7A38" stroke-width="2"/>
  <text x="771" y="259" text-anchor="middle" fill="#DD7A38" font-size="16" font-weight="700">✓ ⚠</text>

  <text x="450" y="302" text-anchor="middle" fill="#9AA3AF" font-size="11.5">even after --hard, commits it rewound past are still in the reflog — only uncommitted edits are truly gone</text>
</svg>
